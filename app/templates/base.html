<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Weather Dashboard{% endblock %} - DevOps Lab</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('web.dashboard_page') }}" class="brand-logo">
                <span class="logo-icon">⛅</span> WeatherTrack
            </a>
            <nav class="nav-links">
                {% if session.get('user_id') %}
                    <span class="user-greeting">Signed in as <strong>{{ session.get('username') }}</strong></span>
                    <a href="{{ url_for('web.dashboard_page') }}" class="nav-link">Dashboard</a>
                    <a href="{{ url_for('auth.logout') }}" class="nav-link btn-logout">Logout</a>
                {% else %}
                    <a href="{{ url_for('web.login_page') }}" class="nav-link">Login</a>
                    <a href="{{ url_for('web.register_page') }}" class="nav-link btn-primary-nav">Register</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="content-wrapper">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 Weather Dashboard Service &bull; Academic DevOps Capstone &bull; Built with Flask &amp; SQLite</p>
    </footer>
</body>
</html>
