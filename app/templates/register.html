{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<div class="auth-card-container">
    <div class="auth-card">
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Register to configure custom temperature alerts and monitor regions.</p>

        <form action="{{ url_for('auth.register') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="Choose a username" autofocus>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" required placeholder="user@example.edu">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="At least 6 characters" minlength="6">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Register Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('web.login_page') }}">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
