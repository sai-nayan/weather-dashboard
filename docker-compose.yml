# ============================================================
# Weather Dashboard — Docker Compose Configuration
# ============================================================

services:
  weather-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather-dashboard
    ports:
      - "5050:5050"
    environment:
      - FLASK_ENV=production
      - PORT=5050
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-prod}
      - DATABASE_URL=sqlite:////app/instance/weather.db
      - GUNICORN_WORKERS=2
      - GUNICORN_THREADS=4
      - GUNICORN_TIMEOUT=120
    volumes:
      - weather-data:/app/instance
      - weather-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - weather-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: weather-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - weather-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: weather-grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - weather-net

networks:
  weather-net:
    driver: bridge

volumes:
  weather-data:
    driver: local
  weather-logs:
    driver: local
