apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: weather-dashboard

resources:
  - ../../base

namePrefix: prod-

images:
  - name: sai-nayan/weather-dashboard
    newTag: v1.0.0

patches:
  - target:
      kind: Deployment
      name: weather-dashboard
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
