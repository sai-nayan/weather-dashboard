apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: weather-dashboard-staging

bases:
  - ../../base

namePrefix: staging-

images:
  - name: sai-nayan/weather-dashboard
    newTag: v2.0.0-rc1

patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: weather-dashboard
    spec:
      replicas: 1
