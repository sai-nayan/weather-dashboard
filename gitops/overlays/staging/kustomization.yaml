apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: weather-dashboard-staging

resources:
  - ../../base

namePrefix: staging-

images:
  - name: sai-nayan/weather-dashboard
    newTag: v2.0.0-rc1

patches:
  - target:
      kind: Deployment
      name: weather-dashboard
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
