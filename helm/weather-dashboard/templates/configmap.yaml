apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "weather-dashboard.fullname" . }}-config
  labels:
    {{- include "weather-dashboard.labels" . | nindent 4 }}
data:
  FLASK_ENV: {{ .Values.env.FLASK_ENV | quote }}
  PORT: {{ .Values.env.PORT | quote }}
  DATABASE_URL: {{ .Values.env.DATABASE_URL | quote }}
