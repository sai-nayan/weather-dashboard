apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weather-dashboard.fullname" . }}
  labels:
    {{- include "weather-dashboard.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "weather-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weather-dashboard.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "weather-dashboard.fullname" .) }}
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-storage-permissions
          image: busybox:latest
          command:
            - sh
            - -c
            - chown -R 1000:1000 /data && chmod -R 775 /data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: storage
              mountPath: /data
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5050
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "weather-dashboard.fullname" . }}-config
          volumeMounts:
            - name: storage
              mountPath: /app/instance
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "weather-dashboard.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
