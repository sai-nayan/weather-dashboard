replicaCount: 2

image:
  repository: sai-nayan/weather-dashboard
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: NodePort
  port: 5050
  targetPort: 5050
  nodePort: 30050

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: weather.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 75

env:
  FLASK_ENV: production
  PORT: "5050"
  DATABASE_URL: "sqlite:////app/instance/weather.db"

persistence:
  enabled: true
  storageClassName: manual
  accessMode: ReadWriteOnce
  size: 1Gi
