apiVersion: v1
kind: Service
metadata:
  name: weather-dashboard-active
  namespace: weather-dashboard
  labels:
    app: weather-dashboard
    role: active-service
spec:
  type: NodePort
  selector:
    app: weather-dashboard
    version: blue
  ports:
    - name: http
      port: 80
      targetPort: 5050
      nodePort: 30080
      protocol: TCP
