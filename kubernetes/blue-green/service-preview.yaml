apiVersion: v1
kind: Service
metadata:
  name: weather-dashboard-preview
  namespace: weather-dashboard
  labels:
    app: weather-dashboard
    role: preview-service
spec:
  type: NodePort
  selector:
    app: weather-dashboard
    version: green
  ports:
    - name: http
      port: 8080
      targetPort: 5050
      nodePort: 30081
      protocol: TCP
