apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-dashboard-ingress
  namespace: weather-dashboard
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: weather.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weather-dashboard-active
                port:
                  number: 80
