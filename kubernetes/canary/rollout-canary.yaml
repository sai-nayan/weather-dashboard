apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: weather-dashboard-rollout
  namespace: weather-dashboard
  labels:
    app: weather-dashboard
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: weather-dashboard
  template:
    metadata:
      labels:
        app: weather-dashboard
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-storage-permissions
          image: busybox:latest
          command:
            - sh
            - -c
            - chown -R 1000:1000 /data && chmod -R 775 /data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: weather-dashboard-storage
              mountPath: /data
      containers:
        - name: weather-dashboard
          image: sai-nayan/weather-dashboard:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5050
              name: http
          envFrom:
            - configMapRef:
                name: weather-dashboard-config
            - secretRef:
                name: weather-dashboard-secret
          volumeMounts:
            - name: weather-dashboard-storage
              mountPath: /app/instance
          livenessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: weather-dashboard-storage
          persistentVolumeClaim:
            claimName: weather-dashboard-pvc
  strategy:
    canary:
      canaryService: weather-dashboard-preview
      stableService: weather-dashboard-active
      trafficRouting:
        nginx:
          stableIngress: weather-dashboard-ingress
      steps:
        - setWeight: 20
        - pause: {duration: 5m}
        - setWeight: 50
        - pause: {duration: 10m}
        - setWeight: 80
        - pause: {duration: 5m}
