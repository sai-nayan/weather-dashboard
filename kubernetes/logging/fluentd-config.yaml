apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: logging
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/containers/*.log
      pos_file /var/log/fluentd-containers.log.pos
      tag kubernetes.*
      read_from_head true

      <parse>
        @type regexp
        expression /^(?<time>[^ ]+) (?<stream>stdout|stderr) [^ ]* (?<log>.*)$/
        time_key time
        time_format %Y-%m-%dT%H:%M:%S.%N%z
      </parse>
    </source>

    # Primary match: Forward to Elasticsearch if available, otherwise mirror to stdout
    <match kubernetes.**>
      @type copy
      <store>
        @type stdout
      </store>
      <store>
        @type elasticsearch
        @id elasticsearch_output
        host "#{ENV['ELASTICSEARCH_HOST'] || 'elasticsearch'}"
        port "#{ENV['ELASTICSEARCH_PORT'] || '9200'}"
        logstash_format true
        logstash_prefix kubernetes
        include_tag_key true
        tag_key @log_name
        <buffer>
          flush_interval 5s
          retry_max_interval 30s
        </buffer>
      </store>
    </match>
