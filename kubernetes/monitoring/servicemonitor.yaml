apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: weather-dashboard
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - weather-dashboard
  selector:
    matchLabels:
      app: weather-dashboard
  endpoints:
    - port: http
      path: /prometheus
      interval: 15s
