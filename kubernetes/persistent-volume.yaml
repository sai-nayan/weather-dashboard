apiVersion: v1
kind: PersistentVolume
metadata:
  name: weather-dashboard-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/weather-dashboard-data
    type: DirectoryOrCreate
    