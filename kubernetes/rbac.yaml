apiVersion: v1
kind: ServiceAccount
metadata:
  name: weather-dashboard-sa
  namespace: weather-dashboard
  labels:
    app: weather-dashboard
    component: rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weather-dashboard-role
  namespace: weather-dashboard
  labels:
    app: weather-dashboard
    component: rbac
rules:
  # Least-privilege access: Application only needs to read its config and secret
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  # Read-only access to its own pod status for telemetry
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weather-dashboard-rolebinding
  namespace: weather-dashboard
  labels:
    app: weather-dashboard
    component: rbac
subjects:
  - kind: ServiceAccount
    name: weather-dashboard-sa
    namespace: weather-dashboard
roleRef:
  kind: Role
  name: weather-dashboard-role
  apiGroup: rbac.authorization.k8s.io
