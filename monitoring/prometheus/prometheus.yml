global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "weather-dashboard"
    metrics_path: "/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["weather-dashboard:5050", "host.docker.internal:5050"]
        labels:
          app: "weather-dashboard"
          env: "production"
